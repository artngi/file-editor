<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>セキュア・ファイル共有システム</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f5f7fa;
            color: #333;
        }
        h1 { text-align: center; color: #4a5568; }
        .section {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h2 { border-bottom: 2px solid #edf2f7; padding-bottom: 8px; margin-top: 0; }
        input[type="file"], input[type="text"], input[type="password"], textarea {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            box-sizing: border-box;
        }
        textarea { height: 60px; resize: vertical; }
        button {
            width: 100%;
            padding: 12px;
            background-color: #4299e1;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover { background-color: #3182ce; }
        .file-list { margin-top: 10px; padding-left: 20px; }
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #edf2f7;
            padding: 6px 12px;
            margin: 4px 0;
            border-radius: 4px;
            font-size: 14px;
        }
        .remove-btn {
            background: #e53e3e;
            color: white;
            border: none;
            border-radius: 3px;
            padding: 2px 8px;
            cursor: pointer;
            font-size: 12px;
        }
        .remove-btn:hover { background: #c53030; }
        .result-box {
            margin-top: 15px;
            padding: 15px;
            background: #ebf8ff;
            border: 1px solid #bee3f8;
            border-radius: 4px;
            word-break: break-all;
        }
        .download-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #edf2f7;
        }
        .dl-btn {
            background: #48bb78;
            padding: 6px 12px;
            width: auto;
            margin: 0;
            font-size: 14px;
        }
        .dl-btn:hover { background: #38a169; }
        .radio-group { margin-top: 10px; }
        .radio-group label { margin-right: 15px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="loginSection" class="section">
        <h2>システムログイン</h2>
        <p style="font-size:14px; color:#718096;">このサイトを利用するにはログインパスワードが必要です。</p>
        <input type="password" id="sitePasswordInput" placeholder="パスワードを入力してください">
        <button id="loginBtn">ログイン</button>
    </div>

    <div id="mainContent" style="display: none;">
        <h1>ファイル共有</h1>

        <div class="section">
            <h2>ファイルの作成（アップロード）</h2>
            <input type="file" id="fileInput" multiple>
            
            <div id="selectedFilesArea" style="margin-top: 15px; display: none;">
                <strong>選択されたファイル（個別解除可能）:</strong>
                <div id="fileList" class="file-list"></div>
            </div>

            <div style="margin-top: 15px;">
                <strong>ダウンロード許可設定:</strong>
                <div class="radio-group">
                    <label><input type="radio" name="emailRestriction" value="all" checked> 全員に許可</label>
                    <label><input type="radio" name="emailRestriction" value="limit"> 特定のGmailに制限</label>
                </div>
                <textarea id="allowedEmailsInput" placeholder="example@gmail.com, test@gmail.com (複数ある場合はカンマやスペース区切り)" style="display: none;"></textarea>
            </div>

            <button id="uploadBtn">作成（アップロード）</button>
            <div id="uploadResult" class="result-box" style="display: none;"></div>
        </div>

        <div class="section">
            <h2>ファイルのダウンロード</h2>
            <input type="text" id="shareKeyInput" placeholder="20桁の共有キーを入力してください">
            <input type="password" id="downloadPasswordInput" placeholder="20桁のダウンロードパスワードを入力してください">
            <input type="text" id="downloaderEmailInput" placeholder="あなたのGmailアドレスを入力してください（全員許可の場合は空欄可）">
            <button id="searchBtn">ファイルを表示</button>

            <div id="downloadArea" style="margin-top: 15px; display: none;">
                <strong>ファイル一覧:</strong>
                <div id="downloadFileList" style="margin-top: 10px;"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = "https://file-edit-server.onrender.com"; 

        // ログイン状態管理用の変数
        let authenticatedPassword = "";
        let selectedFiles = [];

        // 要素の取得
        const loginSection = document.getElementById('loginSection');
        const mainContent = document.getElementById('mainContent');
        const sitePasswordInput = document.getElementById('sitePasswordInput');
        const loginBtn = document.getElementById('loginBtn');

        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const selectedFilesArea = document.getElementById('selectedFilesArea');
        const uploadBtn = document.getElementById('uploadBtn');
        const uploadResult = document.getElementById('uploadResult');
        
        const emailRadios = document.getElementsByName('emailRestriction');
        const allowedEmailsInput = document.getElementById('allowedEmailsInput');

        // サイトログイン処理
        loginBtn.addEventListener('click', async () => {
            const pwd = sitePasswordInput.value.trim();
            try {
                const response = await fetch(`${API_BASE_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pwd })
                });
                if (response.ok) {
                    authenticatedPassword = pwd;
                    loginSection.style.display = "none";
                    mainContent.style.display = "block";
                } else {
                    const data = await response.json();
                    alert(data.error);
                }
            } catch (err) {
                alert("サーバーへの接続に失敗しました。");
            }
        });

        // ラジオボタンの切り替えでGmail入力欄の表示/非表示
        emailRadios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                allowedEmailsInput.style.display = e.target.value === 'limit' ? 'block' : 'none';
            });
        });

        // ファイル選択
        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            selectedFiles = [...selectedFiles, ...files];
            updateFileList();
            fileInput.value = "";
        });

        function updateFileList() {
            fileList.innerHTML = "";
            if (selectedFiles.length === 0) {
                selectedFilesArea.style.display = "none";
                return;
            }
            selectedFilesArea.style.display = "block";
            selectedFiles.forEach((file, index) => {
                const item = document.createElement('div');
                item.className = 'file-item';
                item.innerHTML = `
                    <span>${file.name} (${(file.size / 1024).toFixed(1)} KB)</span>
                    <button class="remove-btn" onclick="removeFile(${index})">削除</button>
                `;
                fileList.appendChild(item);
            });
        }

        window.removeFile = function(index) {
            selectedFiles.splice(index, 1);
            updateFileList();
        };

        // アップロード処理
        uploadBtn.addEventListener('click', async () => {
            if (selectedFiles.length === 0) {
                alert("ファイルを選択してください。");
                return;
            }

            const formData = new FormData();
            selectedFiles.forEach(file => {
                formData.append('files', file);
            });
            
            // セキュリティ情報の追加
            formData.append('site_password', authenticatedPassword);
            
            const isRestricted = document.querySelector('input[name="emailRestriction"]:checked').value === 'limit';
            if (isRestricted) {
                formData.append('allowed_emails', allowedEmailsInput.value);
            }

            uploadBtn.innerText = "アップロード中...";
            uploadBtn.disabled = true;

            try {
                const response = await fetch(`${API_BASE_URL}/upload`, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (response.ok) {
                    uploadResult.style.display = "block";
                    uploadResult.innerHTML = `
                        <strong style="color:#48bb78;">アップロード成功！</strong><br><br>
                        共有キー:<br><strong style="color:#4a5568; font-size:14px; user-select:all;">${data.key}</strong><br><br>
                        ダウンロードパスワード (20桁):<br><strong style="color:#e53e3e; font-size:14px; user-select:all;">${data.password}</strong><br><br>
                        <small style="color:#718096;">※ダウンロード側には上記2つのコードを両方伝えてください。</small>
                    `;
                    selectedFiles = [];
                    updateFileList();
                } else {
                    alert("エラー: " + data.error);
                }
            } catch (err) {
                console.error(err);
                alert("アップロードに失敗しました。");
            } finally {
                uploadBtn.innerText = "作成（アップロード）";
                uploadBtn.disabled = false;
            }
        });

        // 検索・表示処理
        const shareKeyInput = document.getElementById('shareKeyInput');
        const downloadPasswordInput = document.getElementById('downloadPasswordInput');
        const downloaderEmailInput = document.getElementById('downloaderEmailInput');
        const searchBtn = document.getElementById('searchBtn');
        const downloadArea = document.getElementById('downloadArea');
        const downloadFileList = document.getElementById('downloadFileList');

        searchBtn.addEventListener('click', async () => {
            const key = shareKeyInput.value.trim();
            const password = downloadPasswordInput.value.trim();
            const email = downloaderEmailInput.value.trim();

            if (!key || !password) {
                alert("キーとダウンロードパスワードの両方を入力してください。");
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/files/${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password, email })
                });
                const data = await response.json();

                if (response.ok) {
                    downloadArea.style.display = "block";
                    downloadFileList.innerHTML = "";

                    data.files.forEach(filename => {
                        const item = document.createElement('div');
                        item.className = 'download-item';
                        item.innerHTML = `
                            <span>${filename}</span>
                            <button class="dl-btn" onclick="downloadSingleFile('${key}', '${filename}')">ダウンロード</button>
                        `;
                        downloadFileList.appendChild(item);
                    });
                } else {
                    alert("エラー: " + data.error);
                    downloadArea.style.display = "none";
                }
            } catch (err) {
                alert("ファイル情報の取得に失敗しました。");
            }
        });

        // 実際のファイルダウンロード（Blobを生成してセキュアに取得）
        window.downloadSingleFile = async function(key, filename) {
            const password = downloadPasswordInput.value.trim();
            const email = downloaderEmailInput.value.trim();

            try {
                const response = await fetch(`${API_BASE_URL}/download/${key}/${filename}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password, email })
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                } else {
                    alert("ダウンロード権限がないか、エラーが発生しました。");
                }
            } catch (err) {
                alert("ダウンロードに失敗しました。");
            }
        };
    </script>
</body>
</html>
